# nginx configuration to redirect AI tools and LLM indexers to /ai-info/
#
# This redirect runs before any content is served, so it also catches AI
# crawlers that do not execute JavaScript. The JavaScript fallback lives in
# layouts/partials/custom_head.html and covers the GitHub Pages mirror.
#
# Installation (Debian/Ubuntu nginx on the VPS):
#
#   1. Copy this file to /etc/nginx/conf.d/ai-redirect.conf
#      (files in conf.d/ are loaded in the http context by default).
#
#   2. Add the following two `if` blocks to the server block that serves
#      the site (the one with `root /var/www/html;`). Order matters: the
#      $request_uri guard must come BEFORE the redirect.
#
#        # AI agent redirect (uses the $ai_agent map from conf.d)
#        if ($request_uri ~ ^/ai-info/) {
#            set $ai_agent 0;
#        }
#        if ($ai_agent = 1) {
#            return 302 https://keiron.xyz/ai-info/;
#        }
#
#      The first block disables the redirect on /ai-info/ itself so the
#      page can be served without a redirect loop.
#
#   3. Validate and reload:
#        sudo nginx -t && sudo systemctl reload nginx
#
#   4. Rebuild and redeploy the site (./deploy-hugo.sh) so the /ai-info/
#      page, /llms.txt, and the updated robots.txt are live.

# Map AI user agents to a flag consumed by the server-block redirect above.
# Regex keys match case-insensitively against the full User-Agent string.
map $http_user_agent $ai_agent {
    default 0;

    # OpenAI
    ~*GPTBot            1;
    ~*ChatGPT-User      1;
    ~*OAI-SearchBot     1;

    # Anthropic
    ~*ClaudeBot         1;
    ~*Claude-Web        1;
    ~*Claude-AI         1;
    ~*Claude-User       1;
    ~*claude-code       1;
    ~*anthropic-ai      1;

    # Common Crawl (widely used to train LLMs)
    ~*CCBot             1;

    # Perplexity
    ~*PerplexityBot     1;
    ~*Perplexity-User   1;

    # Google AI
    ~*Google-Extended        1;
    ~*Google-CloudVertexBot  1;

    # Meta
    ~*FacebookBot       1;

    # Cohere
    ~*CohereBot         1;
    ~*cohere-ai         1;

    # ByteDance / TikTok
    ~*Bytespider        1;

    # Apple
    ~*Applebot-Extended 1;

    # Others
    ~*ImagesiftBot          1;
    ~*PetalBot              1;
    ~*Timpibot              1;
    ~*VelenPublicWebSolver  1;
    ~*Diffbot               1;
    ~*DataForSeoBot         1;
    ~*Amazonbot             1;
    ~*ExaBot                1;
    ~*GrokBot               1;
    ~*Omgili                1;
    ~*magpie-crawler        1;
}
